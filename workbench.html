<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>工作臺 — 內容創作 & 個人管理</title>
<style>
:root {
  --bg: #0f172a;
  --card: #1e293b;
  --card2: #334155;
  --text: #f1f5f9;
  --muted: #94a3b8;
  --accent: #6366f1;
  --accent2: #8b5cf6;
  --success: #10b981;
  --warning: #f59e0b;
  --danger: #ef4444;
  --radius: 16px;
  --shadow: 0 4px 20px rgba(0,0,0,.3);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  margin: 0; padding: 0;
  font-family: -apple-system, "PingFang HK", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding-bottom: 80px;
}

/* ===== Header ===== */
.header {
  background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
  padding: 20px 16px 16px;
  border-radius: 0 0 24px 24px;
  position: sticky; top: 0; z-index: 100;
}
.header h1 { margin: 0; font-size: 22px; font-weight: 700; }
.header .date { font-size: 13px; opacity: .8; margin-top: 4px; }
.header .stats { display: flex; gap: 16px; margin-top: 12px; }
.stat-item { background: rgba(255,255,255,.15); border-radius: 12px; padding: 8px 16px; text-align: center; }
.stat-item .num { font-size: 20px; font-weight: 700; }
.stat-item .label { font-size: 11px; opacity: .8; }

/* ===== 待辦列表 ===== */
.section { padding: 16px; }
.section-title { font-size: 16px; font-weight: 700; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
.add-btn { background: var(--accent); color: #fff; border: none; border-radius: 50%; width: 32px; height: 32px; font-size: 20px; cursor: pointer; }

.task-list { display: flex; flex-direction: column; gap: 10px; }
.task-card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 14px;
  display: flex;
  align-items: center;
  gap: 12px;
  border: 1px solid var(--card2);
  transition: all .2s;
}
.task-card:hover { border-color: var(--accent); }
.task-card.done { opacity: .5; }
.task-card.done .task-title { text-decoration: line-through; }
.task-checkbox {
  width: 24px; height: 24px; border-radius: 50%;
  border: 2px solid var(--muted); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.task-card.done .task-checkbox { background: var(--success); border-color: var(--success); }
.task-body { flex: 1; min-width: 0; }
.task-title { font-size: 15px; font-weight: 600; }
.task-meta { font-size: 12px; color: var(--muted); margin-top: 4px; }
.task-priority { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
.priority-high { background: var(--danger); color: #fff; }
.priority-medium { background: var(--warning); color: #fff; }
.priority-low { background: var(--success); color: #fff; }
.task-focus-btn {
  background: var(--accent); color: #fff; border: none;
  border-radius: 8px; padding: 8px 12px; font-size: 12px; cursor: pointer;
}

/* ===== 專注計時器 ===== */
.focus-section { background: var(--card); border-radius: var(--radius); padding: 24px; margin: 16px; text-align: center; }
.focus-timer { font-size: 64px; font-weight: 800; font-variant-numeric: tabular-nums; margin: 20px 0; }
.focus-controls { display: flex; gap: 12px; justify-content: center; }
.focus-btn {
  padding: 12px 24px; border-radius: 12px; border: none;
  font-size: 16px; font-weight: 600; cursor: pointer;
}
.focus-btn.start { background: var(--success); color: #fff; }
.focus-btn.pause { background: var(--warning); color: #fff; }
.focus-btn.stop { background: var(--danger); color: #fff; }
.focus-target { font-size: 14px; color: var(--muted); margin-top: 12px; }

/* ===== 花園 ===== */
.garden-section { padding: 16px; }
.garden-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 12px; }
.garden-plant {
  aspect-ratio: 1; background: var(--card); border-radius: var(--radius);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  font-size: 32px; cursor: pointer; transition: all .2s; border: 2px solid transparent;
}
.garden-plant:hover { border-color: var(--accent); transform: scale(1.05); }
.garden-plant.empty { opacity: .3; }
.plant-label { font-size: 10px; color: var(--muted); margin-top: 4px; }

/* ===== 日記區 ===== */
.diary-section { background: var(--card); border-radius: var(--radius); padding: 16px; margin: 16px; }
.diary-textarea {
  width: 100%; background: var(--card2); border: 1px solid var(--card2);
  border-radius: 12px; padding: 12px; color: var(--text);
  font-size: 14px; resize: none; min-height: 120px;
}
.diary-textarea:focus { outline: none; border-color: var(--accent); }
.diary-save { margin-top: 12px; background: var(--accent); color: #fff; border: none; border-radius: 8px; padding: 10px 20px; font-size: 14px; cursor: pointer; }

/* ===== 自動復盤 ===== */
.retro-section { background: var(--card); border-radius: var(--radius); padding: 16px; margin: 16px; }
.retro-card { background: var(--card2); border-radius: 12px; padding: 16px; margin-bottom: 12px; }
.retro-score { font-size: 36px; font-weight: 800; color: var(--success); }
.retro-title { font-size: 14px; font-weight: 600; margin-bottom: 8px; }
.retro-tips { font-size: 13px; color: var(--muted); line-height: 1.6; }

/* ===== 底部導航 ===== */
.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: var(--card); border-top: 1px solid var(--card2);
  display: flex; justify-content: space-around; padding: 12px 0 20px;
  z-index: 100;
}
.nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; color: var(--muted); cursor: pointer; }
.nav-item.active { color: var(--accent); }
.nav-item .icon { font-size: 24px; }

/* ===== 彈窗 ===== */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.7);
  display: none; align-items: center; justify-content: center; z-index: 200; padding: 20px;
}
.modal-overlay.show { display: flex; }
.modal { background: var(--card); border-radius: 20px; padding: 24px; max-width: 360px; width: 100%; }
.modal h2 { margin: 0 0 16px; }
.modal input, .modal select {
  width: 100%; padding: 12px; background: var(--card2); border: 1px solid var(--card2);
  border-radius: 10px; color: var(--text); font-size: 14px; margin-bottom: 12px;
}
.modal input:focus, .modal select:focus { outline: none; border-color: var(--accent); }
.modal-btn { width: 100%; padding: 12px; background: var(--accent); color: #fff; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; }

/* ===== 統計圖表 ===== */
.chart-container { background: var(--card); border-radius: var(--radius); padding: 16px; margin: 16px; }
.chart-bar { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
.chart-label { width: 60px; font-size: 12px; color: var(--muted); }
.chart-track { flex: 1; height: 24px; background: var(--card2); border-radius: 12px; overflow: hidden; }
.chart-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 12px; transition: width .3s; }
.chart-value { width: 50px; font-size: 12px; text-align: right; }
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <h1>🧠 工作臺</h1>
  <div class="date" id="currentDate">載入中...</div>
  <div class="stats">
    <div class="stat-item"><div class="num" id="statTasks">0</div><div class="label">待辦</div></div>
    <div class="stat-item"><div class="num" id="statFocus">0</div><div class="label">分鐘</div></div>
    <div class="stat-item"><div class="num" id="statStars">0</div><div class="label">⭐ 星</div></div>
  </div>
</div>

<!-- Tab: 待辦 & 專注 -->
<div id="tab-tasks" class="tab-content">
  <div class="section">
    <div class="section-title">
      <span>📋 待辦任務</span>
      <button class="add-btn" onclick="showAddTask()">+</button>
    </div>
    <div class="task-list" id="taskList"></div>
  </div>
  
  <div class="focus-section">
    <div class="section-title" style="justify-content: center;">🎯 專注計時</div>
    <div class="focus-target" id="focusTarget">選擇任務開始專注</div>
    <div class="focus-timer" id="focusTimer">25:00</div>
    <div class="focus-controls">
      <button class="focus-btn start" id="btnStart" onclick="startFocus()">開始</button>
      <button class="focus-btn pause" onclick="pauseFocus()" style="display:none" id="btnPause">暫停</button>
      <button class="focus-btn stop" onclick="stopFocus()">結束</button>
    </div>
  </div>
</div>

<!-- Tab: 花園 -->
<div id="tab-garden" class="tab-content" style="display:none">
  <div class="garden-section">
    <div class="section-title">🌻 我的花園</div>
    <div class="garden-grid" id="gardenGrid"></div>
    <div style="text-align:center;margin-top:16px;color:var(--muted);font-size:13px">
      完成專注任務可獲得花朵 🌸
    </div>
  </div>
</div>

<!-- Tab: 日記 -->
<div id="tab-diary" class="tab-content" style="display:none">
  <div class="diary-section">
    <div class="section-title">📔 今日日記</div>
    <textarea class="diary-textarea" id="diaryText" placeholder="記錄今天的心情、靈感..."></textarea>
    <button class="diary-save" onclick="saveDiary()">保存日記</button>
    <div id="diaryHistory" style="margin-top:16px"></div>
  </div>
</div>

<!-- Tab: 統計 & 復盤 -->
<div id="tab-stats" class="tab-content" style="display:none">
  <div class="chart-container">
    <div class="section-title">📊 本周專注統計</div>
    <div id="weekChart"></div>
  </div>
  <div class="retro-section">
    <div class="section-title">🤖 自動復盤</div>
    <div id="retroContent"></div>
  </div>
</div>

<!-- 底部導航 -->
<div class="bottom-nav">
  <div class="nav-item active" onclick="switchTab('tasks', this)">
    <span class="icon">📋</span><span>任務</span>
  </div>
  <div class="nav-item" onclick="switchTab('garden', this)">
    <span class="icon">🌻</span><span>花園</span>
  </div>
  <div class="nav-item" onclick="switchTab('diary', this)">
    <span class="icon">📔</span><span>日記</span>
  </div>
  <div class="nav-item" onclick="switchTab('stats', this)">
    <span class="icon">📊</span><span>統計</span>
  </div>
</div>

<!-- 新增任務彈窗 -->
<div class="modal-overlay" id="addTaskModal">
  <div class="modal">
    <h2>➕ 新增任務</h2>
    <input type="text" id="newTaskTitle" placeholder="任務名稱">
    <select id="newTaskPriority">
      <option value="high">🔴 高優先級</option>
      <option value="medium" selected>🟡 中優先級</option>
      <option value="low">🟢 低優先級</option>
    </select>
    <input type="number" id="newTaskDuration" placeholder="專注時長（分鐘）" value="25">
    <button class="modal-btn" onclick="addTask()">添加</button>
    <button class="modal-btn" style="background:var(--card2);margin-top:8px" onclick="closeModal()">取消</button>
  </div>
</div>

<script>
// ===== 數據 =====
let tasks = JSON.parse(localStorage.getItem('tasks') || '[]');
let focusMinutes = parseInt(localStorage.getItem('focusMinutes') || '0');
let stars = parseInt(localStorage.getItem('stars') || '0');
let garden = JSON.parse(localStorage.getItem('garden') || '[]');
let diary = JSON.parse(localStorage.getItem('diary') || '[]');
let focusData = JSON.parse(localStorage.getItem('focusData') || '[]');
let currentFocusTask = null;
let focusInterval = null;
let focusTime = 25 * 60;
let isPaused = false;

// ===== 初始化 =====
function init() {
  updateDate();
  renderTasks();
  renderGarden();
  renderDiary();
  renderStats();
  updateStats();
  loadDiary();
}

function updateDate() {
  const now = new Date();
  const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
  document.getElementById('currentDate').textContent = now.toLocaleDateString('zh-HK', options);
}

// ===== 待辦任務 =====
function renderTasks() {
  const list = document.getElementById('taskList');
  if (tasks.length === 0) {
    list.innerHTML = '<div style="text-align:center;padding:40px;color:var(--muted)">冇任何任務，點擊 + 新增</div>';
    return;
  }
  list.innerHTML = tasks.map((t, i) => `
    <div class="task-card ${t.done ? 'done' : ''}">
      <div class="task-checkbox" onclick="toggleTask(${i})">${t.done ? '✓' : ''}</div>
      <div class="task-body">
        <div class="task-title">${t.title}</div>
        <div class="task-meta">
          <span class="task-priority priority-${t.priority}">${t.priority === 'high' ? '高' : t.priority === 'medium' ? '中' : '低'}</span>
          · ${t.duration}分鐘
        </div>
      </div>
      <button class="task-focus-btn" onclick="startFocusForTask(${i})">專注</button>
    </div>
  `).join('');
}

function toggleTask(i) {
  tasks[i].done = !tasks[i].done;
  saveData();
  renderTasks();
  updateStats();
}

function showAddTask() {
  document.getElementById('addTaskModal').classList.add('show');
}

function closeModal() {
  document.getElementById('addTaskModal').classList.remove('show');
}

function addTask() {
  const title = document.getElementById('newTaskTitle').value.trim();
  if (!title) return alert('請輸入任務名稱');
  const priority = document.getElementById('newTaskPriority').value;
  const duration = parseInt(document.getElementById('newTaskDuration').value) || 25;
  tasks.push({ title, priority, duration, done: false });
  saveData();
  renderTasks();
  updateStats();
  closeModal();
  document.getElementById('newTaskTitle').value = '';
}

// ===== 專注計時 =====
function startFocusForTask(i) {
  currentFocusTask = tasks[i];
  focusTime = currentFocusTask.duration * 60;
  isPaused = false;
  document.getElementById('focusTarget').textContent = currentFocusTask.title;
  updateTimerDisplay();
  switchTab('tasks', document.querySelector('.nav-item'));
}

function startFocus() {
  if (!currentFocusTask) {
    alert('請先選擇一個任務');
    return;
  }
  if (isPaused) {
    isPaused = false;
    document.getElementById('btnStart').style.display = 'none';
    document.getElementById('btnPause').style.display = 'inline-block';
    focusInterval = setInterval(tickFocus, 1000);
    return;
  }
  focusInterval = setInterval(tickFocus, 1000);
  document.getElementById('btnStart').style.display = 'none';
  document.getElementById('btnPause').style.display = 'inline-block';
}

function pauseFocus() {
  isPaused = true;
  clearInterval(focusInterval);
  document.getElementById('btnStart').style.display = 'inline-block';
  document.getElementById('btnPause').style.display = 'none';
}

function stopFocus() {
  clearInterval(focusInterval);
  const elapsed = Math.floor((currentFocusTask?.duration * 60 || 25 * 60) - focusTime);
  if (elapsed > 0) {
    const mins = Math.floor(elapsed / 60);
    focusMinutes += mins;
    stars += mins;
    focusData.push({ date: new Date().toISOString(), minutes: mins });
    localStorage.setItem('focusData', JSON.stringify(focusData));
    
    // 花園增加植物
    const plants = ['🌸', '🌺', '🌻', '🌹', '🌷', '💐', '🌼', '🪻'];
    garden.push(plants[Math.floor(Math.random() * plants.length)]);
    localStorage.setItem('garden', JSON.stringify(garden));
    renderGarden();
    
    alert(`專注完成！+${mins} 分鐘，+${mins} ⭐`);
    updateStats();
    renderStats();
    saveData();
  }
  focusTime = currentFocusTask ? currentFocusTask.duration * 60 : 25 * 60;
  isPaused = false;
  document.getElementById('btnStart').style.display = 'inline-block';
  document.getElementById('btnPause').style.display = 'none';
  updateTimerDisplay();
}

function tickFocus() {
  if (focusTime > 0) {
    focusTime--;
    updateTimerDisplay();
  } else {
    stopFocus();
  }
}

function updateTimerDisplay() {
  const m = Math.floor(focusTime / 60);
  const s = focusTime % 60;
  document.getElementById('focusTimer').textContent = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
}

// ===== 花園 =====
function renderGarden() {
  const grid = document.getElementById('gardenGrid');
  const maxPlants = 16;
  let html = '';
  for (let i = 0; i < maxPlants; i++) {
    if (i < garden.length) {
      html += `<div class="garden-plant">${garden[i]}</div>`;
    } else {
      html += `<div class="garden-plant empty">·</div>`;
    }
  }
  grid.innerHTML = html;
}

// ===== 日記 =====
function loadDiary() {
  const today = new Date().toISOString().split('T')[0];
  const todayDiary = diary.find(d => d.date === today);
  document.getElementById('diaryText').value = todayDiary?.content || '';
  
  // 顯示歷史
  const history = document.getElementById('diaryHistory');
  if (diary.length > 0) {
    history.innerHTML = diary.slice(-5).reverse().map(d => `
      <div style="background:var(--card2);border-radius:10px;padding:12px;margin-bottom:8px">
        <div style="font-size:12px;color:var(--muted)">${d.date}</div>
        <div style="font-size:14px;margin-top:4px">${d.content}</div>
      </div>
    `).join('');
  }
}

function saveDiary() {
  const content = document.getElementById('diaryText').value.trim();
  if (!content) return;
  const today = new Date().toISOString().split('T')[0];
  const existing = diary.findIndex(d => d.date === today);
  if (existing >= 0) {
    diary[existing].content = content;
  } else {
    diary.push({ date: today, content });
  }
  localStorage.setItem('diary', JSON.stringify(diary));
  alert('日記已保存 ✓');
  loadDiary();
}

// ===== 統計 & 復盤 =====
function renderStats() {
  // 本周圖表
  const chart = document.getElementById('weekChart');
  const days = ['日', '一', '二', '三', '四', '五', '六'];
  const weekData = [];
  const today = new Date();
  for (let i = 6; i >= 0; i--) {
    const d = new Date(today);
    d.setDate(d.getDate() - i);
    const dateStr = d.toISOString().split('T')[0];
    const mins = focusData.filter(f => f.date.startsWith(dateStr)).reduce((s, f) => s + f.minutes, 0);
    weekData.push({ day: days[d.getDay()], mins });
  }
  const maxMins = Math.max(...weekData.map(d => d.mins), 60);
  chart.innerHTML = weekData.map(d => `
    <div class="chart-bar">
      <div class="chart-label">${d.day}</div>
      <div class="chart-track">
        <div class="chart-fill" style="width:${(d.mins/maxMins)*100}%"></div>
      </div>
      <div class="chart-value">${d.mins}分</div>
    </div>
  `).join('');
  
  // 自動復盤
  const retro = document.getElementById('retroContent');
  const totalWeek = weekData.reduce((s, d) => s + d.mins, 0);
  const avg = Math.round(totalWeek / 7);
  const tips = [];
  if (totalWeek < 60) tips.push('今日專注時間較少，建議明日增加專注時段');
  if (totalWeek >= 180) tips.push('表現出色！保持這個節奏 💪');
  if (avg > 30) tips.push('平均每日專注超過30分鐘，很好！');
  else tips.push('可以嘗試延長每次專注時間到25分鐘以上');
  
  retro.innerHTML = `
    <div class="retro-card">
      <div class="retro-score">${totalWeek}分</div>
      <div class="retro-title">本周總專注時間</div>
      <div class="retro-tips">平均每日 ${avg} 分鐘</div>
    </div>
    <div class="retro-card">
      <div class="retro-title">💡 行動建議</div>
      <div class="retro-tips">${tips.join('<br>')}</div>
    </div>
  `;
}

function updateStats() {
  const pending = tasks.filter(t => !t.done).length;
  document.getElementById('statTasks').textContent = pending;
  document.getElementById('statFocus').textContent = focusMinutes;
  document.getElementById('statStars').textContent = stars;
}

// ===== 導航 =====
function switchTab(tab, el) {
  document.querySelectorAll('.tab-content').forEach(t => t.style.display = 'none');
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.getElementById('tab-' + tab).style.display = 'block';
  el.classList.add('active');
  
  if (tab === 'stats') renderStats();
}

// ===== 數據保存 =====
function saveData() {
  localStorage.setItem('tasks', JSON.stringify(tasks));
  localStorage.setItem('focusMinutes', focusMinutes);
  localStorage.setItem('stars', stars);
  localStorage.setItem('garden', JSON.stringify(garden));
}

// ===== 啟動 =====
init();
</script>
</body>
</html>
